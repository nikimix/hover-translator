<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><style>body{font:16px/1.5 sans-serif;margin:0;padding:10px} p{margin:0;width:560px}</style>
<script>
  // Встроенное окно (обычно с другого адреса: localhost против 127.0.0.1). Своя заглушка chrome.*; родитель
  // спрашивает postMessage, сколько было запросов перевода, что за сайт видит content и сколько тут нашего интерфейса (ui).
  // Сообщения «всем фреймам вкладки» (hoverFrame, frameKey) идут через родителя: { htUp } к нему, { htTab } от него (см. stub.html).
  // ?frame=URL — окно в окне: своё встроенное окно (#fr2) под абзацем; его { htUp } уходят выше, { htTab } — и ему,
  // а в отчёт родителю добавляется отчёт вложенного окна (inner).
  const q = new URLSearchParams(location.search);
  window.__calls = [];
  window.__onMessage = [];
  window.__store = Object.assign({ enabled: true, trigger: "dwell", dwellMs: 100, engine: "deepl", displayMode: "replace", targetLang: "RU", apiKey: "k:fx", consent: { deepl: true, openai: true, anthropic: true } }, JSON.parse(q.get("store") || "{}"));
  window.chrome = {
    storage: { local: {
      get(defs, cb) { const out = Object.assign({}, defs, window.__store); if (cb) { setTimeout(() => cb(out), 0); return; } return Promise.resolve(out); },
      set() { return Promise.resolve(); } }, onChanged: { addListener() {} } },
    runtime: { id: "x", getURL: (p) => "chrome-extension://x/" + p, getManifest: () => ({ name: "Cursor Translate" }),
      sendMessage(msg) { window.__calls.push(msg.type); if (msg.type === "hoverFrame" || msg.type === "frameKey") parent.postMessage({ htUp: msg }, "*"); if (msg.type !== "translateBatch") return Promise.resolve({ ok: true });
        return Promise.resolve({ ok: true, texts: msg.items.map((t) => "[RU] " + t), srcLangs: msg.items.map(() => "en") }); },
      onMessage: { addListener(fn) { window.__onMessage.push(fn); } } },
  };
  window.Translator = { async availability() { return "available"; }, async create() { return { translate: async (t) => "[ru] " + t }; } };
  window.LanguageDetector = { async availability() { return "available"; }, async create() { return { detect: async () => [{ detectedLanguage: "en", confidence: 0.99 }] }; } };
  const kid = () => document.getElementById("fr2");
  addEventListener("message", (e) => {
    if (!e.data) return;
    if (e.data.htTab) { for (const fn of window.__onMessage) fn(e.data.htTab, {}, () => {}); if (kid()) kid().contentWindow.postMessage(e.data, "*"); }
    if (e.data.htUp && kid() && e.source === kid().contentWindow) parent.postMessage(e.data, "*");
  });
  const box = (el) => { const r = el.getBoundingClientRect(); return { x: Math.round(r.left), y: Math.round(r.top), w: Math.round(r.width), h: Math.round(r.height) }; };
  const report = () => ({ calls: window.__calls, text: document.getElementById("fp").textContent, fp: box(document.getElementById("fp")),
    fr2: kid() ? box(kid()) : null, focus: document.hasFocus(), act: document.activeElement ? document.activeElement.id || document.activeElement.tagName : null, anc: [...location.ancestorOrigins], ui: document.querySelectorAll("[data-ht-ui]").length });
  addEventListener("message", (e) => {
    if (e.data !== "report") return;
    if (!kid()) { parent.postMessage(report(), "*"); return; }
    const h = (m) => { if (m.source === kid().contentWindow && m.data && m.data.calls) { removeEventListener("message", h); parent.postMessage(Object.assign(report(), { inner: m.data }), "*"); } };
    addEventListener("message", h);
    kid().contentWindow.postMessage("report", "*");
  });
</script></head>
<body><p id="fp">A paragraph inside an embedded frame from another address for the site test.</p>
<script>
  if (q.get("frame")) { const f = document.createElement("iframe"); f.id = "fr2"; f.src = q.get("frame"); f.style.cssText = "display:block;width:580px;height:150px;border:0;margin-top:20px"; document.body.appendChild(f); }
</script>
<script src="/i18n-ru.js"></script><script src="/src/shared.js"></script><script src="/src/content.js"></script></body></html>
