<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title data-i18n="popupTitle"></title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body class="popup">
  <!-- Порядок — по задачам: включить, на какой язык, как вызывать, что сделать со страницей. Выбор
       переводчика и редкие настройки свёрнуты: в обычном состоянии окно помещается в 600 px, больше
       Chrome не показывает.
       Тексты — в _locales/*/messages.json: data-i18n заполняет текст, data-i18n-title/-aria-label/
       -placeholder — атрибуты (shared.js, HT_localize; $1 в них — короткое название расширения). -->
  <header class="appbar">
    <img class="logo" src="icons/48.png" alt="" width="20" height="20" />
    <h1 data-i18n="extShortName"></h1>
  </header>

  <!-- Главный выключатель и сайт активной вкладки. Адрес вкладки окну не виден (нет разрешений
       tabs/activeTab) — имя сайта сообщает content-скрипт её верхнего фрейма; нет ответа — строки нет. -->
  <div class="power">
    <button id="enabled" type="button" class="switch" role="switch" aria-checked="true">
      <span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span>
      <span id="enabledText" class="switch-text" data-i18n="enabledOn"></span>
    </button>
    <label class="cb site-row" id="siteRow" hidden>
      <input type="checkbox" id="siteOn" />
      <span class="site-label" data-i18n="siteOn"></span>
      <span id="siteName" class="site-name"></span>
    </label>
  </div>
  <div class="page-row">
    <p id="pageMsg" class="status" role="status" aria-live="polite"></p>
    <button id="reloadTab" type="button" class="btn-sec" data-i18n="reloadTab" hidden></button>
  </div>

  <!-- Выбранный переводчик не может работать (нет ключа или согласия, нет встроенного): что сделать.
       Тот же случай отмечен «!» на значке расширения. Сюда же — согласие на отправку текста, если
       без него перевод не работает или «авто» переводит только встроенным: одна кнопка «Согласен»,
       без поиска внизу окна. -->
  <div class="setup" id="setup" hidden>
    <p id="setupText" class="setup-text" aria-live="polite"></p>
    <div class="setup-actions">
      <button id="setupGo" type="button" class="btn-sec" hidden></button>
      <button id="setupFix" type="button" class="btn-sec"></button>
    </div>
  </div>
  <!-- Встроенному переводчику нужно скачать модели — первое, что сделать, поэтому его блок
       (builtinBox) на это время переезжает сюда из «Качества перевода». -->
  <div class="setup info" id="prepBox" hidden></div>

  <!-- Списки языков заполняет popup.js из общих таблиц shared.js. -->
  <section class="sec">
    <label class="sec-title" for="targetLang" data-i18n="targetLang"></label>
    <select id="targetLang"></select>
    <div class="chips" id="recentLangs"></div>
  </section>

  <section class="sec">
    <fieldset class="seg-field">
      <legend class="sec-title" data-i18n="trigger"></legend>
      <div class="seg" id="trigger">
        <label><input type="radio" name="trigger" value="shift" /><span data-key="shift">Shift</span></label>
        <label><input type="radio" name="trigger" value="alt" /><span data-key="alt">Alt</span></label>
        <label><input type="radio" name="trigger" value="ctrl" /><span data-key="ctrl">Ctrl</span></label>
        <label><input type="radio" name="trigger" value="dwell" /><span data-i18n="triggerDwell"></span></label>
      </div>
    </fieldset>
    <p id="triggerHint" class="hint" aria-live="polite"></p>
    <div id="dwellField" class="dwell" hidden>
      <div class="dwell-head">
        <label for="dwellMs" data-i18n="dwellLabel"></label>
        <output id="dwellVal" for="dwellMs"></output>
      </div>
      <div class="range-row">
        <span aria-hidden="true" data-i18n="dwellFaster"></span>
        <input type="range" id="dwellMs" min="100" max="2000" step="50" />
        <span aria-hidden="true" data-i18n="dwellSlower"></span>
      </div>
    </div>
  </section>

  <!-- Действия со страницей: иконка + подпись, у «Мини-панели» — нажатое состояние, пока она показана. -->
  <div class="actions">
    <button id="translatePage" type="button" class="act">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 8 6 6"/><path d="m4 14 6-6 2-3"/><path d="M2 5h12"/><path d="M7 2h1"/><path d="m22 22-5-10-5 10"/><path d="M14 18h6"/></svg>
      <span data-i18n="translatePage"></span>
    </button>
    <button id="resetPage" type="button" class="act">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
      <span data-i18n="showOriginal"></span>
    </button>
    <button id="hudBtn" type="button" class="act" aria-pressed="false">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><rect x="10" y="14" width="8" height="4" rx="1"/></svg>
      <span data-i18n="hudBtn"></span>
    </button>
  </div>

  <!-- ===== Качество перевода: переводчик, ключи, согласие ===== -->
  <section class="fold" id="qualityBlock">
    <h2 class="fold-h">
      <button type="button" class="fold-head" id="qualityHead" aria-expanded="false" aria-controls="qualityBody">
        <span class="fold-title" data-i18n="quality"></span>
        <span class="fold-sum" id="qualitySum"></span>
        <svg class="chevron" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
      </button>
    </h2>
    <div class="fold-body" id="qualityBody" hidden>
      <!-- Варианты строит popup.js из HT_ENGINES (shared.js): название и пояснение. -->
      <fieldset class="engines" id="engine">
        <legend class="lbl" data-i18n="engineLegend"></legend>
      </fieldset>

      <!-- Встроенный переводчик: скачаны ли модели, кнопка «Подготовить переводчик» (builtin.js). -->
      <div id="builtinBox" class="bi"></div>

      <!-- Согласие на отправку текста — до первой отправки (требование магазина Chrome). Пока его нет,
           DeepL и ИИ не получают ни одного абзаца: так же, как без ключа. -->
      <div id="consentBox" class="consent" hidden>
        <p id="consentText" class="consent-text"></p>
        <button id="consentOk" type="button" class="btn" data-i18n="agree"></button>
      </div>

      <!-- Согласие дано: что и куда уходит — видно всегда, и согласие можно отозвать. -->
      <p id="consentGiven" class="hint consent-given" hidden>
        <span id="consentGivenText"></span>
        <button type="button" id="consentRevoke" class="linkbtn" data-i18n="consentRevoke"></button>
      </p>

      <!-- Ключ DeepL -->
      <div class="keys" id="keyBlock">
        <label class="lbl" for="apiKey" data-i18n="deeplKey"></label>
        <div class="key-row">
          <input type="password" id="apiKey" data-i18n-placeholder="deeplKeyPlaceholder" autocomplete="off" spellcheck="false" aria-describedby="status quota" />
          <button type="button" id="toggleKey" class="icon-btn" data-i18n-title="showKey" data-i18n-aria-label="showKey" aria-pressed="false">
            <svg class="eye" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="eye-off" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
          <button type="button" id="check" class="btn-sec" data-i18n="check"></button>
        </div>
        <p id="status" class="status" aria-live="polite"></p>
        <p id="quota" class="quota" aria-live="polite"></p>
        <details class="howto" id="deeplHowto">
          <summary data-i18n="howtoSummary"></summary>
          <ol>
            <li data-i18n="howto1"><a data-part="a" href="https://www.deepl.com/pro-api" target="_blank" rel="noopener"></a></li>
            <li data-i18n="howto2"></li>
            <li data-i18n="howto3"></li>
            <li data-i18n="howto4"></li>
          </ol>
          <p class="hint" data-i18n="howtoFree"></p>
        </details>
      </div>

      <!-- ИИ: сервис, ключ, модель -->
      <div class="keys" id="llmBlock">
        <label class="lbl" for="llmProvider" data-i18n="llmService"></label>
        <select id="llmProvider">
          <option value="openai">OpenAI (ChatGPT)</option>
          <option value="anthropic">Anthropic (Claude)</option>
        </select>
        <label class="lbl" for="llmApiKey" id="llmKeyLbl" data-i18n="llmKey"></label>
        <div class="key-row">
          <input type="password" id="llmApiKey" placeholder="sk-..." autocomplete="off" spellcheck="false" aria-describedby="llmStatus" />
          <button type="button" id="toggleLlmKey" class="icon-btn" data-i18n-title="showKey" data-i18n-aria-label="showKey" aria-pressed="false">
            <svg class="eye" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="eye-off" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
          <button type="button" id="llmCheck" class="btn-sec" data-i18n="check"></button>
        </div>
        <label class="lbl" for="llmModelSel" data-i18n="llmModel"></label>
        <!-- Варианты — из HT_LLM_MODELS (shared.js); пустое значение — модель по умолчанию. -->
        <select id="llmModelSel"></select>
        <input type="text" id="llmModel" class="model-other" data-i18n-placeholder="llmModelPlaceholder" autocomplete="off" spellcheck="false" data-i18n-aria-label="llmModelAria" hidden />
        <p id="llmStatus" class="status" aria-live="polite"></p>
        <p class="hint" data-i18n="llmNote"></p>
      </div>

    </div>
  </section>

  <!-- ===== Дополнительно ===== -->
  <section class="fold" id="moreBlock">
    <h2 class="fold-h">
      <button type="button" class="fold-head" id="moreHead" aria-expanded="false" aria-controls="moreBody">
        <span class="fold-title" data-i18n="more"></span>
        <svg class="chevron" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
      </button>
    </h2>
    <div class="fold-body" id="moreBody" hidden>
      <div class="field">
        <label class="lbl" for="sourceLang" data-i18n="sourceLang"></label>
        <select id="sourceLang"></select>
      </div>

      <div class="field" id="formalityField">
        <label class="lbl" for="formality" data-i18n="formality"></label>
        <select id="formality" aria-describedby="formalityNote">
          <option value="default" data-i18n="formalityDefault"></option>
          <option value="more" data-i18n="formalityMore"></option>
          <option value="less" data-i18n="formalityLess"></option>
        </select>
        <p id="formalityNote" class="hint" data-i18n="formalityNote"></p>
      </div>

      <div class="field">
        <label class="lbl" for="displayMode" data-i18n="displayMode"></label>
        <select id="displayMode">
          <option value="replace" data-i18n="displayReplace"></option>
          <option value="popover" data-i18n="displayPopover"></option>
        </select>
        <p id="displayNote" class="hint" data-i18n="displayNote" hidden></p>
        <label class="cb cb-row" id="badgeRow"><input type="checkbox" id="showLangBadge" /> <span data-i18n="showLangBadge"></span></label>
      </div>

      <div class="field">
        <label class="lbl" for="dispMode" data-i18n="dispMode"></label>
        <select id="dispMode">
          <option value="auto" data-i18n="dispAuto"></option>
          <option value="custom" data-i18n="dispCustom"></option>
          <option value="none" data-i18n="dispNone"></option>
        </select>
        <div id="dispCustom" class="disp-custom">
          <div class="control-row">
            <input type="color" id="dispBg" data-i18n-aria-label="dispColor" />
            <label class="sr-only" for="dispOpacity" data-i18n="dispOpacity"></label>
            <input type="range" id="dispOpacity" min="0" max="100" step="1" />
            <output class="muted" id="dispOpacityVal" for="dispOpacity"></output>
          </div>
          <label class="cb cb-row"><input type="checkbox" id="dispBorder" /> <span data-i18n="dispBorder"></span></label>
          <div class="control-row" id="borderControls">
            <select id="dispBorderStyle" data-i18n-aria-label="dispBorderStyle">
              <option value="solid" data-i18n="borderSolid"></option>
              <option value="dashed" data-i18n="borderDashed"></option>
              <option value="dotted" data-i18n="borderDotted"></option>
              <option value="double" data-i18n="borderDouble"></option>
            </select>
            <input type="color" id="dispBorderColor" data-i18n-aria-label="dispBorderColor" />
          </div>
        </div>
      </div>

      <div class="field">
        <label class="lbl" for="noTranslate" data-i18n="noTranslate"></label>
        <textarea id="noTranslate" rows="2" placeholder="GitHub, Vue, nikimix" aria-describedby="noTrNote"></textarea>
        <p id="noTrNote" class="hint" data-i18n="noTranslateNote"></p>
      </div>

      <!-- Переводы DeepL и ИИ сохраняются на 14 дней: повторный перевод бесплатный и мгновенный. -->
      <div class="field" id="cacheRow">
        <span class="lbl" data-i18n="savedTranslations"></span>
        <p id="stats" class="hint" aria-live="polite"></p>
        <div class="row">
          <button id="clearCache" type="button" class="btn-sec" data-i18n="clearCache"></button>
          <span id="cacheMsg" class="hint" aria-live="polite"></span>
        </div>
      </div>

      <!-- Сочетания клавиш (chrome.commands): заполняет popup.js — их могли сменить или не назначить. -->
      <div class="field">
        <span class="lbl" data-i18n="shortcuts"></span>
        <ul class="keys-list" id="keysText"></ul>
        <button type="button" id="keysEdit" class="btn-sec" data-i18n="shortcutsEdit"></button>
      </div>
    </div>
  </section>

  <script src="shared.js"></script>
  <script src="builtin.js"></script>
  <script src="popup.js"></script>
</body>
</html>
