<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="12 12 104 104">
  <!-- Значок 96×96 — для экранов высокой плотности (страница приветствия и окно показывают его вместо 48×48). Рисунок тот же, что в icon.svg, но поля как у icon-48.svg (~4 px вместо 16), чтобы при подмене 48 → 96 значок не уменьшался. -->
