  <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
  <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#081a45" flood-opacity="0.35"/>
  </filter>
  </defs>
  <rect x="16" y="16" width="96" height="96" rx="22" fill="url(#g)"/>
  <rect x="32" y="36" width="62" height="13" rx="6.5" fill="#fff" />
  <rect x="32" y="58" width="44" height="13" rx="6.5" fill="#ffcf4a" />
