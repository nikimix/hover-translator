<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>Варианты значка</title>
<!-- Лист сравнения вариантов значка → assets/icon-variants.png (build.js variants). A — выбранный (значки
     из расширения), B и C — assets/variants/. 16 px показан и в натуральную величину, и увеличенным ×8. -->
<style>
  * { box-sizing: border-box; }
  body { margin: 0; width: 1600px; height: 1000px; padding: 34px 40px; background: #eceff1; color: #1b1d20;
    font-family: "Ubuntu Sans", "Noto Sans", system-ui, sans-serif; }
  h1 { margin: 0; font-size: 30px; font-weight: 750; }
  .lead { margin: 6px 0 22px; font-size: 17px; color: #4b535b; }
  .row { display: grid; grid-template-columns: 250px 1fr 1fr 300px; gap: 16px; align-items: stretch; margin-bottom: 18px; }
  .name { background: #fff; border-radius: 14px; padding: 18px 20px; display: flex; flex-direction: column; justify-content: center; }
  .name b { font-size: 30px; }
  .name span { font-size: 18px; margin-top: 4px; }
  .name small { font-size: 14px; color: #5e666e; margin-top: 8px; line-height: 1.35; }
  .row.pick .name { outline: 4px solid #0b877b; }
  .pickmark { display: inline-block; margin-top: 10px; padding: 4px 10px; border-radius: 12px; background: #0b877b; color: #fff; font-size: 14px; font-weight: 700; align-self: flex-start; }
  .bg { border-radius: 14px; padding: 16px 18px; display: flex; flex-direction: column; gap: 14px; }
  .bg.light { background: #ffffff; color: #3c4043; }
  .bg.dark { background: #35363a; color: #e8eaed; }
  .bar { display: flex; align-items: center; gap: 14px; padding: 7px 14px; border-radius: 18px; }
  .light .bar { background: #f1f3f4; }
  .dark .bar { background: #202124; }
  .g { width: 16px; height: 16px; border-radius: 4px; background: currentColor; opacity: 0.5; }
  .slot { position: relative; width: 16px; height: 16px; }
  .slot img { display: block; width: 16px; height: 16px; }
  .badge { position: absolute; right: -8px; bottom: -6px; padding: 0 3px; border-radius: 4px; font: 700 9px/12px system-ui, sans-serif; color: #fff; background: #5f6368; }
  .badge.err { background: #c62828; }
  .sizes { display: flex; align-items: flex-end; gap: 22px; }
  .sizes figure { margin: 0; text-align: center; font-size: 12px; }
  .sizes figure span { opacity: 0.7; }
  .sizes figure img { display: block; margin: 0 auto 6px; }
  .cap { font-size: 13px; opacity: 0.7; }
  .zoom { background: #fff; border-radius: 14px; padding: 14px; display: flex; gap: 12px; align-items: center; justify-content: center; }
  .zoom img { width: 128px; height: 128px; image-rendering: pixelated; border-radius: 4px; }
</style>
</head>
<body>
<h1>Значок: три варианта</h1>
<p class="lead">Выбран A. Натуральная величина 16, 32, 48 и 128 px на светлой и тёмной панели Chrome (с отметками «off» и «!», которые ставит расширение); справа — 16 px, увеличенный в 8 раз, на светлом и тёмном фоне.</p>
<div id="rows"></div>
<script>
  const V = [
    { id: "A", name: "«Строки»", note: "бирюзовая плитка, курсор над строками, одна строка уже переведена (янтарная)", src: (s) => `../../hover-translate/icons/${s}.png`, pick: true },
    { id: "B", name: "«Лист»", note: "страница без плитки, переведённая строка на подсветке; в 16 px шумно, 4 цвета", src: (s) => `../variants/b-${s}.png` },
    { id: "C", name: "«Круг»", note: "две строки и крупный курсор; круг в 16 px теряет площадь, строки тесные", src: (s) => `../variants/c-${s}.png` },
  ];
  const panel = (v, cls, label) => `
    <div class="bg ${cls}">
      <div class="bar"><span class="g"></span><span class="g"></span>
        <span class="slot"><img src="${v.src(16)}"></span>
        <span class="slot"><img src="${v.src(16)}"><b class="badge">off</b></span>
        <span class="slot"><img src="${v.src(16)}"><b class="badge err">!</b></span>
        <span class="g"></span></div>
      <div class="sizes">
        <figure><img src="${v.src(16)}" width="16" height="16"><span>16</span></figure>
        <figure><img src="${v.src(32)}" width="32" height="32"><span>32</span></figure>
        <figure><img src="${v.src(48)}" width="48" height="48"><span>48</span></figure>
        <figure><img src="${v.src(128)}" width="128" height="128"><span>128</span></figure>
      </div>
      <div class="cap">${label}</div>
    </div>`;
  document.getElementById("rows").innerHTML = V.map((v) => `
    <div class="row ${v.pick ? "pick" : ""}">
      <div class="name"><b>${v.id}</b><span>${v.name}</span><small>${v.note}</small>${v.pick ? '<span class="pickmark">выбран</span>' : ""}</div>
      ${panel(v, "light", "светлая тема")}
      ${panel(v, "dark", "тёмная тема")}
      <div class="zoom"><img src="${v.src(16)}" style="background:#f1f3f4"><img src="${v.src(16)}" style="background:#202124"></div>
    </div>`).join("");
</script>
</body>
</html>
